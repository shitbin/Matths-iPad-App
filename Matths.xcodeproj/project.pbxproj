			shellScript = "# F-07 게이트: 임시 터널/로컬 주소가 기본 서버인 채 Release 로 빌드되는 것을 사람의 기억이 아니라 빌드가 막는다.\n# verify-release.sh [3/5] 는 바이너리 사후 감사이고, 여기서는 소스의 defaultURL 선언을 컴파일 전에 선제 차단한다.\n# 선언 한 줄만 검사하는 이유: DEBUG 전용 localhost 경로는 #if DEBUG 로 Release 바이너리에서 빠지므로 오탐을 막기 위해서다.\nif [ \"${CONFIGURATION}\" != \"Release\" ]; then exit 0; fi\nSRC=\"${SRCROOT}/Matths/ServerAPI.swift\"\nDECL=$(grep -E 'static let defaultURL' \"$SRC\" 2>/dev/null)\nif [ -z \"$DECL\" ]; then\n  # 선언을 못 찾으면 통과가 아니라 실패 — 게이트가 조용히 무력화되는 것을 막는다.\n  echo \"error: ServerAPI.swift 에서 defaultURL 선언을 찾지 못했다. 이 게이트(Run Script)를 코드 구조 변경에 맞게 갱신하라.\"\n  exit 1\nfi\nif echo \"$DECL\" | grep -qE 'trycloudflare|ngrok|loca[.]lt|localhost|127[.]0[.]0[.]1'; then\n  echo \"error: ServerAPI.defaultURL 이 임시/로컬 주소다: $DECL\"\n  echo \"error: 터널 이름은 만료 후 제3자가 재점유할 수 있다. set-server-url.sh 로 정식 도메인으로 바꾼 뒤 다시 빌드하라 (백로그 L-3).\"\n  exit 1\nfi\necho \"Release 서버 주소 게이트 통과: $DECL\"\n";
