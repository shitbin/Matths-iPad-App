			shellScript = "# 데모 게시판 목업(Matths/DemoWeb/)은 **DEBUG 전용 리소스**다. 두 가지를 동시에 해결한다.\n#\n# ① 이름 충돌: 동기화 폴더 그룹(PBXFileSystemSynchronizedRootGroup)은 하위 폴더를 평탄화해\n#    번들 최상단에 붓는다. DemoWeb/brand.css 와 LessonWeb/brand.css 가 이름이 같아서\n#    그대로 두면 \"Multiple commands produce .../Matths.app/brand.css\" 로 빌드가 죽는다.\n#    그래서 membershipExceptions 로 DemoWeb 을 그룹에서 빼고, 여기서 DemoWeb/ 폴더째 복사한다.\n#    (폴더를 유지해야 목업 HTML 이 자기 형제 CSS 를 상대경로로 찾을 수 있다.)\n# ② Release 격리: 데모 모드는 #if DEBUG 전용이다. Release 번들에는 복사하지 않을 뿐 아니라\n#    섞여 들어왔는지 검사까지 한다 — KICE 자료 게이트와 같은 방식.\nSOURCE_DIR=\"${SRCROOT}/Matths/DemoWeb\"\nBUNDLE_DIR=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nDEST_DIR=\"${BUNDLE_DIR}/DemoWeb\"\nif [ \"${CONFIGURATION}\" = \"Debug\" ]; then\n  /bin/rm -rf \"${DEST_DIR}\"\n  /bin/mkdir -p \"${DEST_DIR}\"\n  for SOURCE_FILE in \"${SOURCE_DIR}\"/*; do\n    [ -f \"${SOURCE_FILE}\" ] || continue\n    # Finder resource fork/확장 속성을 서명 대상 번들로 복사하지 않는다.\n    /bin/cp -X -f \"${SOURCE_FILE}\" \"${DEST_DIR}/$(basename \"${SOURCE_FILE}\")\"\n  done\n  if [ ! -f \"${DEST_DIR}/community.html\" ]; then\n    echo \"error: 데모 게시판 목업 진입 페이지를 복사하지 못했다: ${SOURCE_DIR}/community.html\"\n    exit 1\n  fi\n  COUNT=$(/usr/bin/find \"${DEST_DIR}\" -type f | /usr/bin/wc -l | /usr/bin/tr -d \" \")\n  echo \"Debug 데모 게시판 목업 ${COUNT}개 복사 완료 → DemoWeb/\"\n  exit 0\nfi\nif [ -e \"${DEST_DIR}\" ]; then\n  echo \"error: DEBUG 전용 데모 목업이 ${CONFIGURATION} 번들에 포함됐다: ${DEST_DIR}\"\n  exit 1\nfi\n# 평탄화 경로로 새어 들어왔는지도 본다. 이름을 하드코딩하면 목업을 새로 추가한 사람이\n# membershipExceptions 를 빠뜨렸을 때 조용히 통과한다 — 그래서 소스 폴더를 훑어\n# **DemoWeb 에만 있는 이름**을 그때그때 만들어 검사한다. LessonWeb 과 겹치는 이름\n# (brand.css 등)은 정상적으로 번들에 있으므로 제외한다.\nfor SOURCE_FILE in \"${SOURCE_DIR}\"/*; do\n  [ -f \"${SOURCE_FILE}\" ] || continue\n  NAME=$(basename \"${SOURCE_FILE}\")\n  if [ -e \"${SRCROOT}/Matths/LessonWeb/${NAME}\" ]; then continue; fi\n  if [ -e \"${BUNDLE_DIR}/${NAME}\" ]; then\n    echo \"error: DEBUG 전용 데모 목업이 ${CONFIGURATION} 번들 최상단에 평탄화됐다: ${BUNDLE_DIR}/${NAME}\"\n    exit 1\n  fi\ndone\necho \"${CONFIGURATION} 데모 목업 제외 게이트 통과\"\n";
		};
