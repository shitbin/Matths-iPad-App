<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" role="img" aria-label="풀이를 적은 노트 사진">
  <!--
    데모 첨부 이미지 — 실제 사진 대신 그린 "노트 풀이" 목업.
    왜 SVG 인가: 오프라인 번들이라 외부 이미지 URL 을 못 쓰고, 사진 파일을 넣으면
    앱 번들이 커진다. 첨부 그리드(.community-image-grid)의 object-fit: cover 와
    최소 높이 180px 를 시험하는 게 목적이라 종이 질감만 있으면 충분하다.
  -->
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4f5e"/>
      <stop offset="1" stop-color="#2b2f3c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fdfcf6"/>
      <stop offset="0.55" stop-color="#f6f4ea"/>
      <stop offset="1" stop-color="#e9e6d9"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="880" height="620" fill="url(#desk)"/>

  <!-- 살짝 기울인 종이 — 손으로 찍은 사진처럼 -->
  <g transform="rotate(-1.6 440 310)" filter="url(#soft)">
    <rect x="52" y="34" width="776" height="556" rx="6" fill="url(#paper)"/>

    <!-- 가로 괘선 -->
    <g stroke="#c9d4e4" stroke-width="1.6">
      <line x1="86" y1="120" x2="794" y2="120"/>
      <line x1="86" y1="176" x2="794" y2="176"/>
      <line x1="86" y1="232" x2="794" y2="232"/>
      <line x1="86" y1="288" x2="794" y2="288"/>
      <line x1="86" y1="344" x2="794" y2="344"/>
      <line x1="86" y1="400" x2="794" y2="400"/>
      <line x1="86" y1="456" x2="794" y2="456"/>
      <line x1="86" y1="512" x2="794" y2="512"/>
    </g>
    <!-- 세로 여백선 -->
    <line x1="128" y1="60" x2="128" y2="562" stroke="#e6b6b6" stroke-width="1.8"/>

    <g font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" fill="#1d2b52">
      <text x="150" y="98" font-size="27" font-weight="700">2026. 8. 17.  극한 / 로피탈 확인</text>
      <text x="150" y="164" font-size="30">lim (x→0)  (e^x − 1 − x) / x²</text>
      <text x="150" y="220" font-size="26" fill="#2f4a86">분자·분모 → 0/0 꼴</text>
      <text x="150" y="276" font-size="30">= lim (x→0)  (e^x − 1) / 2x</text>
      <text x="150" y="332" font-size="30">= lim (x→0)  e^x / 2   =   1/2</text>
      <text x="150" y="388" font-size="26" fill="#2f4a86">테일러:  e^x = 1 + x + x²/2 + …</text>
      <text x="150" y="444" font-size="30">→ (x²/2 + O(x³)) / x²  =  1/2  ✓</text>
    </g>

    <!-- 빨간 펜 메모 -->
    <g font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" fill="#c8324a">
      <text x="150" y="500" font-size="25" font-weight="700">시험에선 테일러 말고 정석으로!!</text>
      <path d="M146 512 C 300 520 420 506 560 514" stroke="#c8324a" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 연필 자국 -->
    <g stroke="#8b93a6" stroke-width="2.2" fill="none" opacity="0.55" stroke-linecap="round">
      <path d="M620 200 C 660 214 700 196 742 210"/>
      <path d="M628 214 C 668 226 706 210 748 224"/>
    </g>

    <!-- 종이 위 광원 -->
    <rect x="52" y="34" width="776" height="556" rx="6" fill="url(#glare)"/>
  </g>
</svg>
