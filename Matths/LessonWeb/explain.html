<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex.min.css">
<style>
/* 설명 카드 — "한눈에 보기" 가 전부인 화면.
   원칙 셋:
    1. 수식이 주인공이다. 문장보다 크게, 가운데.
    2. 틀린 생각과 옳은 생각을 **나란히** 놓는다. 글로 설명하면 안 읽는다.
    3. 단계는 번호가 아니라 흐름으로 보인다 — 왼쪽 괘선이 이어진다.
   팔레트·서체는 앱 토큰 v4 와 같은 값(다른 화면과 한 몸으로 보이게).

   주의: Xcode 동기화 그룹이 리소스를 번들 루트로 평탄화하므로 참조는 모두 같은 폴더. */
@font-face {
  font-family: "PretendardVar";
  src: url("PretendardVariable.woff2") format("woff2");
  font-weight: 45 920; font-display: swap;
}
:root {
  --content-scale: 1;
  --paper: #f3f6ff; --surface: #ffffff; --ink: #111426; --text2: #4a5268;
  --text3: #747d93; --line: #e3e8f4; --primary: #327ffa; --primary-soft: #e8edff;
  --wrong: #d92b2b; --wrong-soft: #fdecec; --right: #178a4c; --right-soft: #e8f6ee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #090c1b; --surface: #141a2e; --ink: #eef1fa; --text2: #a6aec2;
    --text3: #808aa1; --line: #232a44; --primary: #7e9bff; --primary-soft: #14203f;
    --wrong: #ff6b6b; --wrong-soft: #3a1c1c; --right: #4ad48a; --right-soft: #16321f;
  }
}
/* KaTeX 서브트리는 리셋에서 제외한다. 전역 `*` 로 폰트를 덮으면 KaTeX 가 만든
   글리프 스팬까지 Pretendard 가 되는데, 클래스 없는 관계·연산 기호(=, ≠, +, 괄호,
   숫자)가 전부 여기 걸려서 KaTeX 가 KaTeX_Main 기준으로 잡아 둔 자리와 어긋난다.
   `(x \neq 1)` 의 ≠ 가 뭉개져 보였다(2026-07-29 확인). margin/padding/box-sizing
   리셋도 같은 이유로 KaTeX 안에는 넣지 않는다 — 제 스타일을 그대로 두는 게 맞다. */
/* :where() 로 감싸는 이유 — :not() 만 쓰면 특이도가 (0,2,0)으로 올라가
   .card 같은 클래스 규칙(0,1,0)의 padding·margin 까지 이 리셋이 덮는다.
   실제로 설명 카드의 안쪽 여백이 통째로 사라졌다. :where() 는 특이도 0 이다. */
*:where(:not(.katex, .katex *)) {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: "PretendardVar", -apple-system, "Apple SD Gothic Neo", sans-serif; }
html, body { background: transparent; color: var(--ink); }
.wrap { display: flex; flex-direction: column; gap: 18px; padding: 2px; }

.card { background: var(--surface); border-radius: 18px; padding: 22px 22px 24px;
        border: 1px solid var(--line-strong, var(--line)); }

/* 머리 — 개념 이름을 알약으로, 그 아래 한 문장 */
.chip { display: inline-block; font-size: calc(12px * var(--content-scale)); font-weight: 800; letter-spacing: .02em;
        color: var(--primary); background: var(--primary-soft);
        padding: 5px 11px; border-radius: 999px; }
.no { font-size: calc(12px * var(--content-scale)); font-weight: 800; color: var(--text3); margin-left: 8px; }
.headline { font-size: calc(20px * var(--content-scale)); font-weight: 800; line-height: 1.45; margin-top: 12px; }

/* 핵심 수식 — 이 화면의 주인공. 크게, 가운데, 여백을 준다 */
/* 수식 상자는 **테두리로** 구분한다.
   배경만 --paper 로 깔면 카드(--surface)와 1/255 차이라 눈에 안 잡혀서,
   화면에는 "넓은 빈 띠 가운데 글자 몇 개" 로 보였다(2026-07-29 사용자 지적). */
.hero { margin: 18px 0 6px; padding: 20px 16px; border-radius: 14px;
        background: var(--paper); border: 1px solid var(--line);
        text-align: center; overflow-x: auto; }
.hero .katex { font-size: 1.9em; }
.hero .katex-display { margin: 0; }

.why { font-size: calc(14.5px * var(--content-scale)); line-height: 1.75; color: var(--text2); margin-top: 14px; }

/* 대조 — 틀린 생각 vs 옳은 생각을 나란히 */
.contrast { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
@media (max-width: 620px) { .contrast { grid-template-columns: 1fr; } }
.side { border-radius: 12px; padding: 14px 15px; font-size: calc(14px * var(--content-scale)); line-height: 1.65;
        border: 1px solid transparent; }
.side .tag { display: block; font-size: calc(12px * var(--content-scale)); line-height: 1.5; font-weight: 800; margin-bottom: 6px;
             letter-spacing: .04em; }
.side.w { background: var(--wrong-soft); color: var(--ink); border-color: var(--wrong); }
.side.w .tag { color: var(--wrong); }
.side.r { background: var(--right-soft); color: var(--ink); border-color: var(--right); }
.side.r .tag { color: var(--right); }

/* 단계 — 왼쪽 괘선이 이어지는 흐름 */
.steps { margin-top: 20px; position: relative; padding-left: 26px; }
.steps::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px;
                 width: 2px; background: var(--line); }
.step { position: relative; padding: 10px 0; }
.step::before { content: ""; position: absolute; left: -24px; top: 16px;
                width: 12px; height: 12px; border-radius: 50%;
                background: var(--surface); border: 2.5px solid var(--primary); }
.step .say { font-size: calc(14.5px * var(--content-scale)); font-weight: 650; line-height: 1.6; }
/* 단계 수식은 **왼쪽 정렬** — 설명 문장과 세로선이 맞아야 흐름이 읽힌다.
   가운데 정렬(KaTeX display 기본)이면 단계마다 식이 제멋대로 떠 보인다. */
.step .tex { margin-top: 8px; padding: 11px 14px; border-radius: 10px;
             background: var(--paper); border: 1px solid var(--line);
             overflow-x: auto; }
.step .tex .katex { font-size: 1.2em; }
.step .tex .katex-display { margin: 0; text-align: left; }
.step .tex .katex-display > .katex { text-align: left; }

/* 다음 한 걸음 */
.next { margin-top: 20px; padding: 15px 16px; border-radius: 12px;
        background: var(--primary-soft); font-size: calc(14.5px * var(--content-scale)); line-height: 1.7;
        font-weight: 650; color: var(--ink); }
.next b { color: var(--primary); display: block; font-size: calc(12px * var(--content-scale)); line-height: 1.5;
          letter-spacing: .04em; margin-bottom: 6px; }

.empty { padding: 30px 10px; text-align: center; color: var(--text3); font-size: calc(14px * var(--content-scale)); }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after {
  animation: none !important; transition: none !important;
}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script src="katex.min.js"></script>
<script>
(function () {
  // 네이티브는 base64 로 준다 — LaTeX 백슬래시가 JS 이스케이프로 먹히는 것을 막는다.
  // (직접 주입한 객체가 있으면 그걸 쓴다 — 브라우저 수동 테스트용)
  let payload = window.MATTHS_EXPLAIN || {};
  if (window.MATTHS_EXPLAIN_B64) {
    try {
      const bin = atob(window.MATTHS_EXPLAIN_B64);
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      payload = JSON.parse(new TextDecoder("utf-8").decode(bytes));
    } catch (e) { console.log("explain payload 디코드 실패", e); }
  }
  const wrap = document.getElementById("wrap");

  // 모델이 종종 ASCII 로 흘린다: 9^(1/4), a_(n+1), 3^-1/2.
  // KaTeX 는 `^(` 를 "괄호 하나를 위첨자로" 로 읽어 `9^(1/4)` 가 통째로 깨진다.
  // 렌더 직전에 중괄호 표기로 되돌린다 (원문은 건드리지 않는다).
  const normalizeTex = (raw) => String(raw)
    // ^(...) · _(...) → ^{...} · _{...}  (괄호 짝을 세어 안전하게)
    .replace(/([\^_])\(([^()]*)\)/g, "$1{$2}")
    // ^-1/2 처럼 두 글자 이상인데 중괄호가 없는 경우
    .replace(/([\^_])(-?\d+\/\d+)/g, "$1{$2}")
    .replace(/([\^_])(-\d+)/g, "$1{$2}");

  const tex = (s, display) => {
    if (!s) return "";
    try {
      return katex.renderToString(normalizeTex(s), { throwOnError: false, displayMode: !!display });
    } catch (e) { return escapeHTML(String(s)); }
  };
  const escapeHTML = (s) => String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  /// 문장 안의 $...$ 는 수식으로, 나머지는 평문으로
  const mixed = (s) => escapeHTML(s || "").replace(/\$([^$]+)\$/g, (_, m) => tex(m, false));

  const cards = Array.isArray(payload.cards) ? payload.cards : [];
  if (!cards.length) {
    wrap.innerHTML = '<div class="empty">설명할 만큼 막힌 문항이 없습니다. 잘 풀었습니다.</div>';
    report(); return;
  }

  wrap.innerHTML = cards.map(c => `
    <div class="card">
      <div>
        <span class="chip">${escapeHTML(c.concept || "개념")}</span>
        ${c.no ? `<span class="no">${escapeHTML(String(c.no))}번 문항</span>` : ""}
      </div>
      <div class="headline">${mixed(c.headline)}</div>
      ${c.keyFormula ? `<div class="hero">${tex(c.keyFormula, true)}</div>` : ""}
      ${c.why ? `<div class="why">${mixed(c.why)}</div>` : ""}
      ${c.contrast ? `
        <div class="contrast">
          <div class="side w"><span class="tag">이렇게 생각했다</span>${mixed(c.contrast.wrong)}</div>
          <div class="side r"><span class="tag">이렇게 봐야 한다</span>${mixed(c.contrast.right)}</div>
        </div>` : ""}
      ${Array.isArray(c.steps) && c.steps.length ? `
        <div class="steps">
          ${c.steps.map(s => `
            <div class="step">
              <div class="say">${mixed(s.say)}</div>
              ${s.tex ? `<div class="tex">${tex(s.tex, true)}</div>` : ""}
            </div>`).join("")}
        </div>` : ""}
      ${c.nextStep ? `<div class="next"><b>다음 한 걸음</b>${mixed(c.nextStep)}</div>` : ""}
    </div>`).join("");

  function report() {
    const h = Math.ceil(document.body.scrollHeight);
    try { window.webkit.messageHandlers.explainHeight.postMessage(h); } catch (e) {}
  }
  requestAnimationFrame(() => { report(); setTimeout(report, 300); setTimeout(report, 1000); });
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  window.addEventListener("resize", report);
})();
</script>
</body>
</html>
