<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4">
<link rel="stylesheet" href="katex.min.css">
<style>
:root { --content-scale: 1; color-scheme: light dark; }
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
#frame {
  width: 100%;
  border: 1px solid #e3e8f4;
  border-radius: 14px;
  overflow: hidden;
  background: #fcfdff;
}
svg { display: block; width: 100%; height: auto; min-height: 220px; }
@media (prefers-color-scheme: dark) {
  #frame { background: #141a2e; border-color: #232a44; }
  #frame svg { filter: invert(.89) hue-rotate(180deg); }
  #frame foreignObject { filter: invert(1) hue-rotate(180deg); }
}
</style>
</head>
<body>
<div id="frame"><svg id="plot" viewBox="0 0 760 440" role="img"></svg></div>
<script src="katex.min.js"></script>
<script src="arena-problem-visualization.js"></script>
<script>
(function () {
  "use strict";
  const svg = document.getElementById("plot");

  function render(model) {
    try {
      const rendered = window.ArenaProblemVisualization?.renderInto(svg, model);
      document.getElementById("frame").hidden = rendered !== true;
      if (rendered && window.katex) {
        document.querySelectorAll("[data-math-tex]").forEach((node) => {
          const target = node.querySelector(".arena-svg-math-formula");
          if (!target) return;
          try {
            katex.render(node.dataset.mathTex || "", target, {
              throwOnError: false,
              displayMode: false
            });
          } catch (_) {}
        });
      }
    } catch (_) {
      document.getElementById("frame").hidden = true;
    }
  }

  window.renderArenaVisualization = render;
  render(window.MATTHS_ARENA_VISUALIZATION || {});
})();
</script>
</body>
</html>
